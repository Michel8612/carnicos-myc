# ============================================================
#  App de Android (APK) — Cárnicos M&C
#
#  Se compila EN GITHUB dentro de una imagen Docker que ya trae
#  el SDK de Android, Java y Node instalados. Así no hay que
#  descargar nada en la PC y siempre sale igual.
#
#  La app es un contenedor nativo que abre el sistema alojado en
#  Netlify: lleva el logo de la empresa, se abre en vertical (como
#  cualquier app de teléfono) y se actualiza sola cuando se
#  despliega la web, sin reinstalar nada.
#
#  Al terminar, el APK queda para descargar en la pestaña
#  "Actions" del repositorio.
# ============================================================

name: APK Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:        # permite lanzarlo a mano desde la web

jobs:
  construir:
    runs-on: ubuntu-latest

    # Imagen con Android SDK + Java 17 ya instalados.
    container:
      image: ghcr.io/cirruslabs/android-sdk:34

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del proyecto
        run: npm install --omit=optional

      - name: Instalar Capacitor
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Poner el logo de la empresa como icono
        # Genera todos los tamaños de icono y la pantalla de inicio a partir
        # de las imágenes de assets/ (hechas con el logo real del negocio).
        run: npx @capacitor/assets generate --android --assetPath assets

      - name: Dejar la app en vertical (formato de teléfono)
        # Se fija la orientación vertical y se impide que el sistema
        # reinicie la pantalla al girar el teléfono.
        run: |
          MANIFIESTO=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name="com.carnicosmyc.gestion.MainActivity"|android:name="com.carnicosmyc.gestion.MainActivity"\n            android:screenOrientation="portrait"|' $MANIFIESTO
          grep -q 'screenOrientation' $MANIFIESTO && echo "Vertical configurado" || echo "Aviso: no se pudo fijar la orientación"

      - name: Sincronizar la app
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK con el nombre del negocio
        run: |
          cd android/app/build/outputs/apk/debug
          for f in *.apk; do mv "$f" "Carnicos-M&C.apk" 2>/dev/null || true; done
          ls -lh

      - name: Guardar el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: carnicos-myc-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Con una etiqueta (v1.0.0) además se publica en Releases,
      # para poder compartir un enlace de descarga directo.
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk

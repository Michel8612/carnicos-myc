# ============================================================
#  Compilar la app de Android (APK) — Cárnicos M&C
#
#  Se compila EN GITHUB dentro de una imagen Docker que ya trae
#  el SDK de Android, Java y Node instalados. Así no hay que
#  descargar nada en la PC ni esperar a que GitHub instale el SDK
#  en cada intento: es más rápido y siempre igual.
#
#  Al terminar, el APK (unos 4 MB) queda para descargar en la
#  pestaña "Actions" del repositorio.
#
#  La app es un contenedor nativo que abre el sistema alojado en
#  Netlify, así que se actualiza sola al desplegar la web.
# ============================================================

name: APK Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:        # permite lanzarlo a mano desde la web

jobs:
  construir:
    runs-on: ubuntu-latest

    # Imagen con Android SDK + Java 17 + Node ya instalados.
    container:
      image: ghcr.io/cirruslabs/android-sdk:34

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del proyecto
        run: npm install --omit=optional

      - name: Instalar Capacitor
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Sincronizar la app
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: carnicos-myc-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Con una etiqueta (v1.0.0) además se publica en Releases,
      # para poder compartir un enlace de descarga directo.
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk

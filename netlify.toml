# ============================================================
#  Netlify — Cárnicos M&C
#
#  - Frontend estático (public/) servido por Netlify.
#  - Backend Express como UNA función serverless (netlify/functions/api.js).
#  - /api/* -> la función.  DB: Neon (Postgres).
#
#  Variables (Site settings -> Environment variables):
#     DATABASE_URL, JWT_SECRETO
# ============================================================

[build]
  # No hay build del frontend (páginas estáticas). Solo se publica public/.
  command = "echo sin-build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # 'pg' SÍ se empaqueta (es JavaScript puro). Solo se excluye 'pg-native',
  # que es el binario opcional que 'pg' intenta cargar y no usamos: si se
  # deja como externo sin instalar, la función no arranca (error 502).
  external_node_modules = ["pg-native"]

# La API -> función serverless
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

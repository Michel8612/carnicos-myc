<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cárnicos M&C - Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">
  <div class="login-container">
    <!-- Logo centrado -->
    <img src="img/logo.png" alt="Cárnicos M&C" class="logo">

    <!-- Formulario de login -->
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <input type="text" id="email" placeholder="Usuario" autocomplete="username" required>
      <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>

    <!-- Mensajes de error -->
    <p id="error-message" class="error"></p>
  </div>

  <!-- Cliente de API (reemplaza a Firebase) -->
  <script src="js/api.js"></script>
  <!-- Script de autenticación -->
  <script src="js/auth.js"></script>
</body>
</html>

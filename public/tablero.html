<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Indicadores - Cárnicos M&C</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.tab-body { margin:0; font-family:Arial, Helvetica, sans-serif; background:linear-gradient(to bottom,#f5f5f5,#e0f7fa); color:#000; }
    header { text-align:center; padding:18px 20px 20px; background:#263238; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25); }
    .logo-empresa { width:76px; height:76px; object-fit:contain; display:block; margin:0 auto 8px; background:#fff; border-radius:50%; padding:6px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
    header h1 { color:#fff; font-size:22px; letter-spacing:.5px; text-shadow:0 1px 3px rgba(0,0,0,.4); margin:8px 0; }

    .tab-wrap { max-width:1100px; margin:0 auto; padding:0 12px 40px; }

    /* ---------- Selector de periodo ---------- */
    .filtros { display:flex; gap:8px; flex-wrap:wrap; align-items:end; background:#fff; padding:12px; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,.08); margin:16px 0 6px; }
    .filtros label { display:block; font-size:11.5px; color:#555; margin-bottom:3px; }
    .filtros input[type="date"] { padding:8px; border:1px solid #cfd8dc; border-radius:8px; font-size:13.5px; }
    .filtros button { padding:9px 13px; border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:bold; white-space:nowrap; }
    .b-atajo { background:#eceff1; color:#37474f; } .b-atajo:hover { background:#cfd8dc; }
    .b-filtrar { background:#1976D2; color:#fff; } .b-filtrar:hover { background:#1565C0; }
    .b-imprimir { background:#455a64; color:#fff; margin-left:auto; } .b-imprimir:hover { background:#263238; }
    p.rango-texto { text-align:center; font-size:12.5px; color:#607d8b; margin:2px 0 14px; }

    /* ---------- Rejilla de tarjetas ---------- */
    .rejilla { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:14px 0; }
    .tarjeta { background:#fff; border-radius:12px; padding:14px; text-align:center; box-shadow:0 3px 10px rgba(0,0,0,.1); }
    .tarjeta .n { font-size:21px; font-weight:bold; word-break:break-word; }
    .tarjeta .l { font-size:11.5px; color:#666; margin-top:3px; }
    .tarjeta .sub { font-size:11px; color:#90a4ae; margin-top:4px; }
    .c-azul .n { color:#1565C0; } .c-verde .n { color:#2e7d32; } .c-rojo .n { color:#c62828; }
    .c-morado .n { color:#6a1b9a; } .c-naranja .n { color:#e65100; } .c-gris .n { color:#455a64; }
    .tarjeta.destacada { background:#263238; }
    .tarjeta.destacada .n, .tarjeta.destacada .l { color:#fff; }
    .tendencia { font-size:13px; font-weight:bold; margin-top:4px; }
    .tendencia.sube { color:#2e7d32; } .tendencia.baja { color:#e53935; } .tendencia.igual { color:#90a4ae; }
    .vencido-aviso { color:#c62828; font-weight:bold; }

    /* ---------- Gráfico ---------- */
    .seccion { background:#fff; border-radius:12px; padding:14px; margin:18px 0; box-shadow:0 3px 10px rgba(0,0,0,.1); }
    .seccion h2 { margin:0 0 4px; font-size:15px; color:#263238; }
    .seccion p.sub { margin:0 0 10px; font-size:12px; color:#777; }
    .leyenda { display:flex; gap:14px; font-size:11.5px; color:#546e7a; margin-bottom:6px; }
    .leyenda span { display:inline-flex; align-items:center; gap:5px; }
    .leyenda i { width:10px; height:10px; border-radius:2px; display:inline-block; }
    .grafico-wrap svg { width:100%; height:auto; display:block; }

    /* ---------- Alertas ---------- */
    .lista-alertas { list-style:none; margin:0; padding:0; }
    .lista-alertas li { display:flex; justify-content:space-between; gap:10px; align-items:center;
      padding:9px 10px; border-radius:8px; margin-bottom:6px; font-size:13px; text-decoration:none; }
    .lista-alertas li.al-urgente { background:#ffebee; color:#8d1a1a; }
    .lista-alertas li.al-aviso { background:#fff8e1; color:#7a5c00; }
    .lista-alertas a.al-link { color:inherit; text-decoration:underline; font-size:12px; white-space:nowrap; }
    .vacio { text-align:center; color:#777; padding:20px; }

    @media (max-width:600px) {
      .rejilla { grid-template-columns:1fr; }
      .filtros { flex-direction:column; align-items:stretch; }
      .b-imprimir { margin-left:0; }
    }

    /* La hoja impresa no necesita navegación ni botones: solo las cifras. */
    @media print {
      header .top-nav, .filtros, .b-imprimir { display:none !important; }
      body.tab-body { background:#fff; }
      .seccion, .tarjeta { box-shadow:none; border:1px solid #ccc; }
    }
  </style>
</head>

<body class="tab-body">
  <header>
    <img src="img/logo.png" alt="Cárnicos M&C" class="logo-empresa logo-circulo">
    <h1>Tablero de Indicadores</h1>
    <div class="top-nav">
      <a href="#" id="navPanel" style="display:none;">← Panel</a>
      <a href="#" onclick="logout();return false;">Salir</a>
    </div>
  </header>

  <main class="tab-wrap">
    <div class="filtros">
      <div>
        <label for="fDesde">Desde</label>
        <input type="date" id="fDesde">
      </div>
      <div>
        <label for="fHasta">Hasta</label>
        <input type="date" id="fHasta">
      </div>
      <button type="button" class="b-atajo" id="bEsteMes">Este mes</button>
      <button type="button" class="b-atajo" id="bMesPasado">Mes pasado</button>
      <button type="button" class="b-atajo" id="bUltimos30">Últimos 30 días</button>
      <button type="button" class="b-filtrar" id="bFiltrar">Filtrar</button>
      <button type="button" class="b-imprimir" id="bImprimir">🖨 Imprimir</button>
    </div>
    <p class="rango-texto" id="rangoTexto"></p>

    <div class="rejilla" id="rejilla">
      <p class="vacio">Cargando…</p>
    </div>

    <div class="seccion">
      <h2>Ventas de los últimos 30 días</h2>
      <p class="sub">Incluye los días sin ventas, para que la tendencia se lea de verdad.</p>
      <div class="leyenda">
        <span><i style="background:#90caf9"></i> Ingreso</span>
        <span><i style="background:#2e7d32"></i> Ganancia</span>
      </div>
      <div class="grafico-wrap" id="grafico"></div>
    </div>

    <div class="seccion">
      <h2>Alertas</h2>
      <ul class="lista-alertas" id="listaAlertas"><li class="vacio" style="background:none;">Cargando…</li></ul>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/sonidos.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/tablero.js"></script>
</body>
</html>
